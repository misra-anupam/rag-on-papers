[tool.poetry]
name = "rag-on-papers"
version = "0.1.0"
description = "Production-grade RAG system for medical research papers"
authors = ["misra-anupam"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"

# HTTP + retry
httpx = "^0.27"
tenacity = "^8.2"

# Task queue
celery = {version = "^5.3", extras = ["redis"]}
celery-beat = "^2.6"
kombu = "^5.3"

# Database
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
alembic = "^1.13"

# AWS
boto3 = "^1.34"

# PDF parsing
grobid-client-python = "^0.8"
lxml = "^5.1"
pymupdf = "^1.24"

# Chunking + tokenisation
langchain-text-splitters = "^0.2"
tiktoken = "^0.7"

# Embeddings + vector store
qdrant-client = "^1.9"
fastembed = "^0.3"
numpy = "^1.26"

# Agent
crewai = "^0.63"

# Evaluation
ragas = "^0.1"
mlflow = "^2.14"
datasets = "^2.20"

# Observability
structlog = "^24.1"
opentelemetry-sdk = "^1.24"
opentelemetry-exporter-otlp = "^1.24"
prometheus-client = "^0.20"

# Data models
pydantic = "^2.7"
pydantic-settings = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T10", # flake8-debugger (breakpoint / pdb)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["modules", "shared"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Catch real bugs without requiring full annotation coverage on every function
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
